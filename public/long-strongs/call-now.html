<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Call Now — The Long Strongs</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-hero:  #1B3D2B;
      --green-dark:  #0f2318;
      --green-mid:   #2A6041;
      --green-light: #3a7a55;
      --amber:       #C8952A;
      --amber-light: #F5C842;
      --white:       #FFFFFF;
      --gray-light:  #F4F6F4;
      --gray-mid:    #E8EDE9;
      --text-dark:   #1A2E23;
      --text-body:   #3d4f45;
      --text-muted:  #6b8074;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Barlow', sans-serif; background: var(--white); color: var(--text-dark); line-height: 1.6; }

    /* ─── NAV ─── */
    nav {
      position: sticky; top: 0; z-index: 200;
      background: var(--white); border-bottom: 1px solid #d8e4da;
      padding: 0 2rem; display: flex; align-items: center;
      justify-content: space-between; height: 68px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .nav-left { display: flex; align-items: center; }
    .nav-logo { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
    .nav-logo-badge {
      width: 38px; height: 38px; background: var(--green-mid); border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Barlow Condensed', sans-serif; font-size: 1.1rem;
      font-weight: 800; color: var(--white); letter-spacing: -0.02em;
    }
    .nav-logo-text { font-family: 'Barlow Condensed', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--green-dark); }
    .nav-links { display: flex; align-items: center; gap: 0.15rem; list-style: none; margin-left: 1.75rem; }
    .nav-links a {
      color: var(--text-body); text-decoration: none; font-size: 0.9rem;
      font-weight: 600; padding: 0.4rem 0.85rem; border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }
    .nav-links a:hover { background: var(--gray-light); color: var(--green-mid); }
    .nav-cta {
      background: var(--green-mid); color: var(--white);
      font-family: 'Barlow Condensed', sans-serif; font-size: 0.88rem;
      font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
      text-decoration: none; padding: 0.55rem 1.25rem; border-radius: 4px;
      transition: background 0.15s;
    }
    .nav-cta:hover { background: var(--green-dark); }

    /* ─── PLACEHOLDER ─── */
    #main {
      min-height: calc(100vh - 68px);
      background: var(--green-hero);
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 4rem 2rem;
    }
    .placeholder-inner { max-width: 520px; }
    .placeholder-icon { font-size: 4rem; margin-bottom: 1.5rem; }
    .placeholder-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 800;
      color: var(--white); line-height: 1.0; margin-bottom: 1rem;
    }
    .placeholder-sub { color: #9ab8a4; font-size: 1rem; line-height: 1.65; margin-bottom: 2rem; }
    .btn-back {
      display: inline-block; background: var(--amber); color: var(--white);
      font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 800;
      letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none;
      padding: 0.85rem 2rem; border-radius: 5px; transition: background 0.2s;
    }
    .btn-back:hover { background: #e0a830; }

    @media (max-width: 768px) { .nav-links { display: none; } }
  </style>
</head>
<body>

<!-- ═══ NAV ═══ -->
<nav>
  <div class="nav-left">
    <a class="nav-logo" href="long-strongs.html">
      <div class="nav-logo-badge">LS</div>
      <span class="nav-logo-text">THE LONG STRONGS</span>
    </a>
    <ul class="nav-links">
      <li><a href="baby-steps.html">7 Steps</a></li>
      <li><a href="miranda-story.html">Miranda's Story</a></li>
      <li><a href="for-you.html">Who Is This For?</a></li>
      <li><a href="call-now.html">Call Now</a></li>
    </ul>
  </div>
  <a href="long-strongs.html#cta" class="nav-cta">Listen Now</a>
</nav>

<!-- ═══ PLACEHOLDER ═══ -->
<main id="main">
  <div class="placeholder-inner">
    <div class="placeholder-icon">📞</div>
    <h1 class="placeholder-title">Coming Soon</h1>
    <p class="placeholder-sub">Call-in details are on their way. In the meantime, start with the 7 Long Strong Baby Steps and find out where you are.</p>
    <a href="baby-steps.html" class="btn-back">See the 7 Steps →</a>
  </div>
</main>

</body>
</html>
